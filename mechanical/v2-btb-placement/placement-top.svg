<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1120" viewBox="0 0 1080 1120"><rect width="1080" height="1120" fill="#f5f7fa"/><style>text{font-family:Arial,sans-serif;fill:#24364a}.h{font-weight:700}.sub{fill:#556578}</style><text x="45" y="55" font-size="29" class="h">V2 MAINBOARD / FRONT BTB CANDIDATE</text><text x="45" y="85" font-size="17" class="sub">KiCad top view | candidate only: screen tail mating not verified</text><rect x="85" y="160" width="460" height="760" rx="24" fill="#dce8e2" stroke="#355b4d" stroke-width="2"/><rect x="297.23" y="211.68" width="220" height="300" fill="#a0adb8" fill-opacity=".24" stroke="#6c7a8b" stroke-dasharray="7 5"/><text x="307.0" y="250" font-size="16" class="h">OLD U9 MODULE</text><text x="307.0" y="275.0" font-size="15" >removed in V2</text><rect x="94.99" y="225.81" width="155.76" height="163.64" fill="#b8c5d4" stroke="#526983"/><text x="108.0" y="290" font-size="19" class="h">TF / CARD2</text><rect x="330.0" y="422.0" width="110" height="60" fill="#ffdd99" fill-opacity=".65" stroke="#bd7b11" stroke-dasharray="4 3"/><rect x="348.4" y="439.05" width="73.2" height="25.9" rx="2" fill="#176c78"/><path d="M376,452.0h18 M385,443.0v18" fill="none" stroke="#fff" stroke-width="1"/><path d="M85,452.0H385 M385,160V452.0" stroke="#108ba3" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><text x="195" y="444.0" font-size="16" >X = 30.00</text><text x="395" y="350" font-size="16" >Y = 29.20</text><path d="M425,452.0L605,424H990" fill="none" stroke="#176c78" stroke-width="2"/><text x="620" y="400" font-size="22" class="h">OK-23GF024-04 / F.Cu</text><text x="620" y="454" font-size="20" class="h">Center: (30.00, 29.20) mm</text><text x="620" y="487" font-size="18" >Global: (158.868, 96.847)</text><text x="620" y="520" font-size="18" >Long axis along X</text><text x="620" y="550" font-size="17" >Reserve 11 x 6 mm for placement</text><text x="620" y="590" font-size="17" fill="#a65d08">90 or 270 deg: verify actual pin 1</text><text x="620" y="675" font-size="22" class="h">Why this area?</text><text x="620" y="712" font-size="17" >Old adapter XY would hit the TF socket.</text><text x="620" y="742" font-size="17" >This area is available after removing U9.</text><text x="620" y="772" font-size="17" >No other modeled collision was found.</text><text x="620" y="832" font-size="20" class="h">Height must be rechecked:</text><text x="620" y="864" font-size="17" >Mainboard solder plane Z = 5.8 mm</text><text x="620" y="894" font-size="17" >4.3 mm below the old adapter plane.</text><text x="620" y="924" font-size="17" >Native screen FPC needs a new fold.</text><text x="60" y="145" font-size="16" class="h">(0,0)</text><text x="95" y="955" font-size="18" >Nominal Edge.Cuts frame: 46 x 76 mm</text><text x="95" y="985" font-size="17" >KiCad datum: (128.868, 67.647)</text><text x="45" y="1050" font-size="17" >Yellow: engineering reservation; gray: old module footprint envelope.</text><text x="45" y="1080" font-size="17" >Motherboard and enclosure originals are unchanged. Do not freeze production from this study.</text></svg>